<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Native FireSim scene runtime stabilization diagram">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#080b0d"/>
      <stop offset="0.55" stop-color="#11171a"/>
      <stop offset="1" stop-color="#060708"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" x2="1">
      <stop offset="0" stop-color="#ff4b12"/>
      <stop offset="0.45" stop-color="#ffd164"/>
      <stop offset="1" stop-color="#78cfff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title{font:700 34px Consolas,monospace;fill:#edf7ef}
      .sub{font:18px Consolas,monospace;fill:#91a7a8}
      .box{fill:#101719;stroke:#3b4c4f;stroke-width:2}
      .boxHot{fill:#15100b;stroke:#ff8842;stroke-width:2}
      .label{font:700 20px Consolas,monospace;fill:#ecf4ef}
      .small{font:15px Consolas,monospace;fill:#a9bab9}
      .cyan{stroke:#5bdcff;stroke-width:3;fill:none}
      .orange{stroke:#ff7a22;stroke-width:3;fill:none}
      .arrow{stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5bdcff"/>
    </marker>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <text x="60" y="70" class="title">Native FireSim Runtime Stabilization</text>
  <text x="60" y="104" class="sub">One scene transaction drives mesh, emitter, CUDA volume, D3D passes, UI overlays, and validation evidence.</text>

  <rect x="60" y="155" width="235" height="120" rx="8" class="box"/>
  <text x="82" y="195" class="label">Scene input</text>
  <text x="82" y="226" class="small">button / S key</text>
  <text x="82" y="250" class="small">manifest + selected source</text>

  <rect x="360" y="145" width="270" height="140" rx="8" class="boxHot"/>
  <text x="386" y="188" class="label">Scene transaction</text>
  <text x="386" y="220" class="small">stop worker -> clear stale frame</text>
  <text x="386" y="244" class="small">load mesh/emitter -> reset sim</text>
  <text x="386" y="268" class="small">force UI reupload</text>

  <rect x="700" y="155" width="220" height="120" rx="8" class="box"/>
  <text x="724" y="195" class="label">CUDA worker</text>
  <text x="724" y="226" class="small">scene source fields</text>
  <text x="724" y="250" class="small">FP16 shared ring</text>

  <rect x="965" y="155" width="175" height="120" rx="8" class="box"/>
  <text x="988" y="195" class="label">D3D frame</text>
  <text x="988" y="226" class="small">mesh + volume</text>
  <text x="988" y="250" class="small">isolated UI pass</text>

  <path d="M295 215 C320 215 332 215 360 215" class="cyan arrow"/>
  <path d="M630 215 C655 215 672 215 700 215" class="cyan arrow"/>
  <path d="M920 215 C938 215 948 215 965 215" class="cyan arrow"/>

  <rect x="105" y="390" width="260" height="145" rx="10" class="box"/>
  <text x="132" y="432" class="label">Debug overlays</text>
  <text x="132" y="465" class="small">emitter rings</text>
  <text x="132" y="489" class="small">GLB/source alignment</text>
  <text x="132" y="513" class="small">frame age and status</text>

  <rect x="470" y="370" width="275" height="175" rx="10" fill="#0b1012" stroke="#5bdcff" stroke-width="2"/>
  <ellipse cx="608" cy="498" rx="82" ry="20" fill="none" stroke="#5bdcff" stroke-width="5" opacity="0.9"/>
  <path d="M560 496 C548 450 576 430 585 384 C602 435 632 438 618 496 Z" fill="url(#fire)" opacity="0.86" filter="url(#glow)"/>
  <path d="M620 496 C622 462 650 446 645 408 C682 454 690 475 664 498 Z" fill="#9bd6ff" opacity="0.58" filter="url(#glow)"/>
  <text x="505" y="405" class="label">Selected burner source</text>
  <text x="505" y="528" class="small">projected through the same camera as the mesh</text>

  <rect x="835" y="390" width="260" height="145" rx="10" class="box"/>
  <text x="862" y="432" class="label">Validation gate</text>
  <text x="862" y="465" class="small">diagnostics pass</text>
  <text x="862" y="489" class="small">input stress pass</text>
  <text x="862" y="513" class="small">live D3D capture proof</text>

  <path d="M365 463 C410 463 427 463 470 463" class="orange arrow"/>
  <path d="M745 463 C784 463 798 463 835 463" class="orange arrow"/>
  <path d="M495 285 C495 325 520 345 566 375" class="cyan arrow"/>
  <path d="M810 275 C770 330 724 360 670 392" class="cyan arrow"/>
</svg>
