<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Native FireSim display pacing and flame smoke split</title>
  <desc id="desc">Diagram showing CUDA worker shared FP16 ring copied into a private display ring, then rendered separately from a stricter flame-front and soot absorption model.</desc>
  <rect width="1200" height="560" fill="#080b0f"/>
  <defs>
    <linearGradient id="fire" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ff4b11"/>
      <stop offset="0.55" stop-color="#ffb640"/>
      <stop offset="1" stop-color="#fff0b0"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#6f7780"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#8fb7ff"/>
    </marker>
  </defs>
  <text x="44" y="58" fill="#e8eef5" font-family="Consolas, monospace" font-size="28" font-weight="700">DISPLAY PACING SPLIT</text>
  <text x="656" y="58" fill="#e8eef5" font-family="Consolas, monospace" font-size="28" font-weight="700">FLAME / SMOKE OPTICS SPLIT</text>

  <rect x="44" y="94" width="230" height="92" rx="10" fill="#111820" stroke="#2e4053"/>
  <text x="66" y="132" fill="#b8d7ff" font-family="Consolas, monospace" font-size="18">CUDA worker</text>
  <text x="66" y="162" fill="#76889a" font-family="Consolas, monospace" font-size="14">renders FP16 HDR frame</text>

  <rect x="342" y="94" width="230" height="92" rx="10" fill="#111820" stroke="#2e4053"/>
  <text x="364" y="132" fill="#b8d7ff" font-family="Consolas, monospace" font-size="18">shared ring</text>
  <text x="364" y="162" fill="#76889a" font-family="Consolas, monospace" font-size="14">keyed mutex slots</text>

  <rect x="44" y="264" width="230" height="92" rx="10" fill="#111820" stroke="#2e4053"/>
  <text x="66" y="302" fill="#b8d7ff" font-family="Consolas, monospace" font-size="18">private display ring</text>
  <text x="66" y="332" fill="#76889a" font-family="Consolas, monospace" font-size="14">3 local FP16 SRVs</text>

  <rect x="342" y="264" width="230" height="92" rx="10" fill="#111820" stroke="#2e4053"/>
  <text x="364" y="302" fill="#b8d7ff" font-family="Consolas, monospace" font-size="18">present loop</text>
  <text x="364" y="332" fill="#76889a" font-family="Consolas, monospace" font-size="14">renders last good frame</text>

  <path d="M274 140 H330" stroke="#8fb7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M457 186 V250" stroke="#8fb7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M342 310 H286" stroke="#8fb7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M274 310 H330" stroke="#8fb7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="52" y="430" fill="#9fb0c1" font-family="Consolas, monospace" font-size="17">Result: UI present no longer blocks one-for-one on copied worker frames.</text>
  <text x="52" y="462" fill="#9fb0c1" font-family="Consolas, monospace" font-size="17">Latest capture: ~55-63 fps display, ~133 fps worker, ~26-27Hz copies.</text>

  <rect x="656" y="94" width="214" height="92" rx="10" fill="#12100d" stroke="#66351f"/>
  <text x="678" y="132" fill="#ffbc66" font-family="Consolas, monospace" font-size="18">flame fronts</text>
  <text x="678" y="162" fill="#a78d72" font-family="Consolas, monospace" font-size="14">thin sheets emit</text>

  <rect x="934" y="94" width="214" height="92" rx="10" fill="#101318" stroke="#3a4652"/>
  <text x="956" y="132" fill="#bec8d4" font-family="Consolas, monospace" font-size="18">soot plume</text>
  <text x="956" y="162" fill="#7f8994" font-family="Consolas, monospace" font-size="14">neutral absorption</text>

  <rect x="656" y="264" width="214" height="92" rx="10" fill="#12100d" stroke="#66351f"/>
  <text x="678" y="302" fill="#ffbc66" font-family="Consolas, monospace" font-size="18">scene light</text>
  <text x="678" y="332" fill="#a78d72" font-family="Consolas, monospace" font-size="14">reduced warm bounce</text>

  <rect x="934" y="264" width="214" height="92" rx="10" fill="#101318" stroke="#3a4652"/>
  <text x="956" y="302" fill="#bec8d4" font-family="Consolas, monospace" font-size="18">volume renderer</text>
  <text x="956" y="332" fill="#7f8994" font-family="Consolas, monospace" font-size="14">separate emission/soot</text>

  <path d="M870 140 H922" stroke="url(#fire)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1041 186 V250" stroke="url(#smoke)" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M934 310 H882" stroke="#8fb7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M870 310 H922" stroke="#8fb7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="664" y="430" fill="#9fb0c1" font-family="Consolas, monospace" font-size="17">Result: upper smoke is cooler black/gray instead of sepia peach.</text>
  <text x="664" y="462" fill="#9fb0c1" font-family="Consolas, monospace" font-size="17">Known remaining gap: lower plume still needs more discrete flame tongues.</text>
</svg>
